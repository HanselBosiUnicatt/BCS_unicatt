<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BCS Unicatt</title>
<style>
body{font-family:Arial,Helvetica,sans-serif;background:#f5f5f5;margin:0}.container{max-width:980px;margin:auto;padding:20px}.card{background:#fff;border-radius:14px;padding:16px;box-shadow:0 6px 20px #00000018;margin-bottom:16px}.small{color:#555;font-size:13px;margin:6px 0}.badge{display:inline-block;background:#eee;padding:4px 8px;border-radius:999px;font-size:12px}.buttons{display:flex;justify-content:space-between;gap:10px;margin-top:15px;flex-wrap:wrap}button{padding:10px 16px;border:0;border-radius:10px;font-weight:bold;cursor:pointer}.next{background:#111;color:#fff}.prev{background:#ddd}.danger{background:#c62828;color:#fff}input[type=text]{width:100%;box-sizing:border-box;padding:12px;border:1px solid #ddd;border-radius:10px;font-size:16px}.guide{width:100%;display:block;margin:10px auto;border-radius:10px}.big{font-size:28px;font-weight:900}.hidden{display:none}.scoreBox{display:flex;align-items:center;gap:14px;margin-top:14px}.scoreBox input{flex:1}table{width:100%;border-collapse:collapse;margin-top:10px}th,td{border-bottom:1px solid #eee;padding:10px;text-align:left;vertical-align:top}th{background:#fafafa}@media(max-width:650px){.container{padding:10px}.guide{min-height:300px}.scoreBox{display:block}.scoreBox input{width:100%}}
</style></head><body><div class="container">
<div class="card" id="start"><div style="font-weight:800;font-size:18px">Nouvel animal</div><div class="small">Saisissez l’ID et appuyez sur « Commencer l’évaluation ».</div><label><b>Animal ID</b></label><input id="animalId" type="text" placeholder="Ex. 12345 ou code de l’exploitation"><div class="buttons"><button class="next" id="startBtn">Commencer l’évaluation</button></div></div>
<div class="card hidden" id="eval"><div class="small"><span class="badge">Animal ID :</span> <b id="animalLabel"></b></div><img id="guide" class="guide" alt="Guide d’évaluation BCS"><div class="scoreBox"><input id="slider" type="range" min="1" max="5" step="0.25" value="3"><div>Valeur : <span class="big" id="value">3.00</span></div></div><div class="buttons"><button class="prev" id="prev">Précédent</button><button class="next" id="next">Suivant</button></div></div>
<div class="card hidden" id="result"><div style="font-weight:800;font-size:18px">Résultat final</div><p><span class="badge">Animal ID :</span> <b id="resultId"></b></p><p>BCS (moyenne pondérée) :</p><p class="big" id="finalScore"></p><p id="comment"></p><div class="buttons"><button class="next" id="newBtn">Nouvel animal</button><button class="prev" id="copyBtn">Copier la liste</button><button class="prev" id="csvBtn">Télécharger le CSV</button><button class="prev" id="shareBtn">Partager</button><button class="danger" id="clearBtn">Vider la liste</button></div></div>
<div class="card"><div style="font-weight:800;font-size:18px">Carnet BCS</div><div class="small">Liste des animaux évalués, conservée dans ce navigateur.</div><table><thead><tr><th>#</th><th>Animal ID</th><th>BCS</th><th>Détails</th></tr></thead><tbody id="log"></tbody></table></div>
</div><script>
const sections=[
{img:'img/s1.png'},
{img:'img/s2.png'},
{img:'img/s3.png'},
{img:'img/s4.png'},
{img:'img/s5.png'},
{img:'img/s6.png'},
{img:'img/s7.png'},
{img:'img/s8.png'}
];
const names=['Profil des processus épineux (PE)','Profil entre PE et PT','Profil des processus transverses (PT)','Profil au-dessus du flanc','Tubérosités coxale et ischiatique','Région entre fesse et hanche','Profil entre les hanches','Zone d’attache de la queue – pointe des fesses'];
const key='bcs_taccuino_v5';let i=0,vals=Array(8).fill(3),id='';const $=x=>document.getElementById(x);const load=()=>{try{return JSON.parse(localStorage.getItem(key)||'[]')}catch{return[]}},save=a=>localStorage.setItem(key,JSON.stringify(a));
function show(a){$('start').classList.toggle('hidden',a!=='s');$('eval').classList.toggle('hidden',a!=='e');$('result').classList.toggle('hidden',a!=='r')}
function step(){$('animalLabel').textContent=id;$('guide').src=sections[i].img;$('slider').value=vals[i];$('value').textContent=Number(vals[i]).toFixed(2);$('prev').style.visibility=i?'visible':'hidden';$('next').textContent=i===7?'Calculer':'Suivant'}
function render(){let a=load();$('log').innerHTML=a.map((r,n)=>'<tr><td>'+(n+1)+'</td><td>'+esc(r.animalId)+'</td><td><b>'+Number(r.bcs).toFixed(2)+'</b></td><td><button class="prev" onclick="details('+n+')">Voir</button></td></tr>').join('')}
window.details=n=>{let r=load()[n];if(!r)return;alert('Animal ID: '+r.animalId+' — BCS: '+Number(r.bcs).toFixed(2)+'\n\n'+(r.sections||[]).map((v,j)=>names[j]+': '+Number(v).toFixed(2)).join('\n'))};
function textLog(){let a=load();if(!a.length)return 'Aucun enregistrement.';return a.map((r,n)=>(n+1)+') '+r.animalId+' - BCS '+Number(r.bcs).toFixed(2)+'\n'+(r.sections||[]).map((v,j)=>'  - '+names[j]+': '+Number(v).toFixed(2)).join('\n')).join('\n\n')}
$('startBtn').onclick=()=>{id=$('animalId').value.trim();if(!id){alert('Saisissez l’ID de l’animal');return}i=0;vals=Array(8).fill(3);show('e');step()};$('slider').oninput=e=>{vals[i]=Number(e.target.value);$('value').textContent=vals[i].toFixed(2)};$('prev').onclick=()=>{if(i){i--;step()}};$('next').onclick=()=>{if(i<7){i++;step();return}let avg=vals.reduce((a,b)=>a+b,0)/8,a=load();a.push({animalId:id,bcs:+avg.toFixed(2),sections:[...vals],ts:Date.now()});save(a);render();$('resultId').textContent=id;$('finalScore').textContent=avg.toFixed(2);$('comment').textContent=avg<2?'État corporel très maigre':avg<3?'État corporel maigre':avg<4?'État corporel optimal':'État corporel gras';show('r')};$('newBtn').onclick=()=>{show('s');$('animalId').value=''};$('clearBtn').onclick=()=>{if(confirm('Voulez-vous vraiment vider la liste ?')){localStorage.removeItem(key);render()}};$('copyBtn').onclick=async()=>{try{await navigator.clipboard.writeText(textLog());alert('Liste copiée dans le presse-papiers !')}catch{alert(textLog())}};$('shareBtn').onclick=async()=>{let t=textLog();if(navigator.share)try{await navigator.share({title:'BCS Log',text:t})}catch{}else navigator.clipboard.writeText(t)};$('csvBtn').onclick=()=>{let a=load(),rows=[['Animal ID','BCS',...names,'Timestamp'],...a.map(r=>[r.animalId,Number(r.bcs).toFixed(2),...(r.sections||[]).map(v=>Number(v).toFixed(2)),new Date(r.ts).toISOString()])],csv=rows.map(r=>r.map(c=>'"'+String(c??'').replaceAll('"','""')+'"').join(',')).join('\n'),u=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'})),x=document.createElement('a');x.href=u;x.download='bcs_log.csv';x.click();URL.revokeObjectURL(u)};render();show('s');
</script></body></html>
