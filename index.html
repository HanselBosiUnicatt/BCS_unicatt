<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<title>BCS Unicatt</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  body{font-family:Arial,Helvetica,sans-serif;background:#f5f5f5;margin:0}
  .container{max-width:980px;margin:auto;padding:20px}
  .card{background:#fff;border-radius:14px;padding:16px;box-shadow:0 6px 20px rgba(0,0,0,.1);margin-bottom:16px}
  .hidden{display:none}
  .small{color:#555;font-size:13px;margin-top:6px}
  .badge{display:inline-block;background:#eee;padding:4px 8px;border-radius:999px;font-size:12px}
  .buttons{display:flex;justify-content:space-between;gap:10px;margin-top:15px;flex-wrap:wrap}
  button{padding:10px 16px;border:none;border-radius:10px;font-weight:bold;cursor:pointer}
  .next{background:#111;color:#fff}
  .prev{background:#ddd}
  .danger{background:#c62828;color:#fff}
  input[type="text"]{width:100%;padding:12px;border:1px solid #ddd;border-radius:10px;font-size:16px}
  img{max-width:100%;border-radius:10px;display:block;margin:0 auto}

  /* Wheel picker */
  .wheelWrap{margin-top:14px}
  .wheelBox{
    position:relative;
    height:160px;
    border:1px solid #eee;
    border-radius:14px;
    overflow:hidden;
    background:#fafafa;
  }
  .wheel{
    height:160px;
    overflow-y:auto;
    scroll-snap-type:y mandatory;
    -webkit-overflow-scrolling:touch;
    padding:52px 0; /* spazio sopra/sotto per centrare */
  }
  .wheel::-webkit-scrollbar{width:8px}
  .wheelItem{
    height:40px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:22px;
    scroll-snap-align:center;
    color:#555;
  }
  .wheelItem.active{color:#000;font-weight:800}
  .wheelMarker{
    position:absolute;
    left:0; right:0;
    top:50%;
    transform:translateY(-50%);
    height:40px;
    border-top:2px solid rgba(0,0,0,.08);
    border-bottom:2px solid rgba(0,0,0,.08);
    pointer-events:none;
    background:rgba(255,255,255,.55);
  }

  table{width:100%;border-collapse:collapse;margin-top:10px}
  th,td{border-bottom:1px solid #eee;padding:10px;text-align:left}
  th{background:#fafafa}

  .big{font-size:28px;font-weight:900}
</style>
</head>

<body>
<div class="container">

  <!-- START -->
  <div class="card" id="startCard">
    <div style="font-weight:800;font-size:18px">Nuovo animale</div>
    <div class="small">Inserisci l’ID e premi “Inizia valutazione”.</div>
    <label for="animalId"><b>Animal ID</b></label>
    <input id="animalId" type="text" placeholder="Es. 12345 o codice aziendale">
    <div class="buttons">
      <button class="next" id="startBtn">Inizia valutazione</button>
    </div>
  </div>

  <!-- VALUTAZIONE -->
  <div class="card hidden" id="evalCard">
    <div class="small"><span class="badge">Animal ID:</span> <b id="animalIdLabel"></b></div>
    <img id="image" alt="guida valutazione">

    <div class="wheelWrap">
      <div class="small">Seleziona valore (1.00 → 5.00, step 0.25)</div>
      <div class="wheelBox">
        <div class="wheelMarker"></div>
        <div class="wheel" id="wheel"></div>
      </div>
      <p style="margin:10px 0 0 0">Valore selezionato: <span class="big" id="valueText">3.00</span></p>
    </div>

    <div class="buttons">
      <button class="prev" id="prevBtn">Indietro</button>
      <button class="next" id="nextBtn">Avanti</button>
    </div>
  </div>

  <!-- RISULTATO -->
  <div class="card hidden" id="resultCard">
    <div style="font-weight:800;font-size:18px">Risultato finale</div>
    <p><span class="badge">Animal ID:</span> <b id="resultAnimalId"></b></p>
    <p>BCS (media ponderata):</p>
    <p class="big" id="finalScore"></p>
    <p id="finalComment"></p>

    <div class="buttons">
      <button class="next" id="newAnimalBtn">Nuovo animale</button>
      <button class="prev" id="copyBtn">Copia lista</button>
      <button class="prev" id="csvBtn">Scarica CSV</button>
      <button class="prev" id="shareBtn">Condividi</button>
      <button class="danger" id="clearBtn">Svuota lista</button>
    </div>
    <div class="small" id="shareHint"></div>
  </div>

  <!-- TACCUINO -->
  <div class="card" id="logCard">
    <div style="font-weight:800;font-size:18px">Taccuino BCS</div>
    <div class="small">Lista animali valutati (salvata anche se ricarichi la pagina).</div>
    <table>
      <thead>
        <tr><th>#</th><th>Animal ID</th><th>BCS</th></tr>
      </thead>
      <tbody id="logBody"></tbody>
    </table>
  </div>

</div>

<script>
/* =======================
   CONFIG
======================= */
const sections = [
  { img:"img/s1.png" },
  { img:"img/s2.png" },
  { img:"img/s3.png" },
  { img:"img/s4.png" },
  { img:"img/s5.png" },
  { img:"img/s6.png" },
  { img:"img/s7.png" },
  { img:"img/s8.png" },
];

// Pesi (se vuoi li personalizziamo)
const weights = [1,1,1,1,1,1,1,1];

// valori picker
const VALUES = [];
for(let v=1.00; v<=5.0001; v+=0.25) VALUES.push(Number(v.toFixed(2)));

/* =======================
   STORAGE (taccuino)
======================= */
const STORAGE_KEY = "bcs_taccuino_v3";

function loadLog(){
  try { return JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]"); }
  catch { return []; }
}
function saveLog(arr){ localStorage.setItem(STORAGE_KEY, JSON.stringify(arr)); }
function addToLog(animalId, bcs){
  const log = loadLog();
  log.push({ animalId, bcs:Number(bcs.toFixed(2)), ts:Date.now() });
  saveLog(log);
  renderLog();
}
function clearLog(){
  localStorage.removeItem(STORAGE_KEY);
  renderLog();
}
function renderLog(){
  const log = loadLog();
  logBody.innerHTML = "";
  log.forEach((r, idx) => {
    const tr = document.createElement("tr");
    tr.innerHTML = `<td>${idx+1}</td><td>${escapeHtml(r.animalId)}</td><td><b>${r.bcs.toFixed(2)}</b></td>`;
    logBody.appendChild(tr);
  });
}
function escapeHtml(s){
  return String(s)
    .replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;")
    .replaceAll('"',"&quot;").replaceAll("'","&#039;");
}

/* =======================
   DOM
======================= */
const startCard = document.getElementById("startCard");
const evalCard = document.getElementById("evalCard");
const resultCard = document.getElementById("resultCard");

const animalIdInput = document.getElementById("animalId");
const startBtn = document.getElementById("startBtn");

const animalIdLabel = document.getElementById("animalIdLabel");
const image = document.getElementById("image");

const wheel = document.getElementById("wheel");
const valueText = document.getElementById("valueText");

const prevBtn = document.getElementById("prevBtn");
const nextBtn = document.getElementById("nextBtn");

const resultAnimalId = document.getElementById("resultAnimalId");
const finalScore = document.getElementById("finalScore");
const finalComment = document.getElementById("finalComment");

const newAnimalBtn = document.getElementById("newAnimalBtn");
const copyBtn = document.getElementById("copyBtn");
const csvBtn = document.getElementById("csvBtn");
const shareBtn = document.getElementById("shareBtn");
const clearBtn = document.getElementById("clearBtn");
const shareHint = document.getElementById("shareHint");

const logBody = document.getElementById("logBody");

/* =======================
   STATO valutazione
======================= */
let i = 0;
let values = Array(8).fill(3.00);
let currentAnimalId = "";

/* =======================
   Wheel: build + sync
======================= */
function buildWheel(){
  wheel.innerHTML = "";
  VALUES.forEach((val) => {
    const div = document.createElement("div");
    div.className = "wheelItem";
    div.textContent = val.toFixed(2);
    div.dataset.value = val.toFixed(2);
    wheel.appendChild(div);
  });
}

function setWheelToValue(val){
  const idx = VALUES.indexOf(Number(val.toFixed(2)));
  const y = idx * 40; // item height
  wheel.scrollTo({ top: y, behavior: "instant" });
  updateActiveFromScroll();
}

let wheelScrollTimer = null;
wheel.addEventListener("scroll", () => {
  if(wheelScrollTimer) clearTimeout(wheelScrollTimer);
  wheelScrollTimer = setTimeout(() => {
    snapWheel();
  }, 80);
  updateActiveFromScroll();
});

function snapWheel(){
  const idx = Math.round(wheel.scrollTop / 40);
  const clamped = Math.max(0, Math.min(VALUES.length-1, idx));
  wheel.scrollTo({ top: clamped * 40, behavior: "smooth" });

  const chosen = VALUES[clamped];
  values[i] = chosen;
  valueText.textContent = chosen.toFixed(2);
  updateActiveItem(clamped);
}

function updateActiveFromScroll(){
  const idx = Math.round(wheel.scrollTop / 40);
  updateActiveItem(idx);
}

function updateActiveItem(activeIdx){
  const items = wheel.querySelectorAll(".wheelItem");
  items.forEach((el, idx) => el.classList.toggle("active", idx === activeIdx));
}

/* =======================
   Flow UI
======================= */
function showStart(){
  startCard.classList.remove("hidden");
  evalCard.classList.add("hidden");
  resultCard.classList.add("hidden");
  animalIdInput.value = "";
  currentAnimalId = "";
}

function showEval(){
  startCard.classList.add("hidden");
  evalCard.classList.remove("hidden");
  resultCard.classList.add("hidden");
  loadStep();
}

function showResult(avg){
  evalCard.classList.add("hidden");
  resultCard.classList.remove("hidden");
  resultAnimalId.textContent = currentAnimalId;
  finalScore.textContent = avg.toFixed(2);

  // placeholder commenti (poi me li dai precisi)
  if(avg<2) finalComment.textContent="Condizione molto magra";
  else if(avg<3) finalComment.textContent="Condizione magra";
  else if(avg<4) finalComment.textContent="Condizione ottimale";
  else finalComment.textContent="Condizione grassa";

  // share support hint
  if(navigator.share){
    shareHint.textContent = "“Condividi” usa il menu del telefono (WhatsApp/Mail/Telegram, ecc.).";
  } else {
    shareHint.textContent = "Su PC “Condividi” potrebbe non funzionare: usa Copia lista o CSV.";
  }
}

function resetEvaluation(){
  i = 0;
  values = Array(8).fill(3.00);
}

function loadStep(){
  animalIdLabel.textContent = currentAnimalId;
  image.src = sections[i].img;

  prevBtn.style.visibility = i===0 ? "hidden" : "visible";
  nextBtn.textContent = i===7 ? "Calcola" : "Avanti";

  valueText.textContent = values[i].toFixed(2);
  setWheelToValue(values[i]);
}

/* =======================
   Export helpers
======================= */
function makeTextLog(){
  const log = loadLog();
  if(!log.length) return "Nessun record.";
  return log.map((r, idx) => `${idx+1}) ${r.animalId} - BCS ${Number(r.bcs).toFixed(2)}`).join("\n");
}

async function copyToClipboard(text){
  // fallback robusto
  try {
    await navigator.clipboard.writeText(text);
    alert("Lista copiata negli appunti!");
  } catch {
    const ta = document.createElement("textarea");
    ta.value = text;
    document.body.appendChild(ta);
    ta.select();
    document.execCommand("copy");
    document.body.removeChild(ta);
    alert("Lista copiata negli appunti!");
  }
}

function downloadCSV(){
  const log = loadLog();
  const rows = [["Animal ID","BCS","Timestamp"]];
  log.forEach(r => rows.push([r.animalId, Number(r.bcs).toFixed(2), new Date(r.ts).toISOString()]));
  const csv = rows.map(row => row.map(cell => `"${String(cell).replaceAll('"','""')}"`).join(",")).join("\n");

  const blob = new Blob([csv], {type:"text/csv;charset=utf-8"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = "bcs_log.csv";
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
}

/* =======================
   Eventi
======================= */
startBtn.onclick = () => {
  const id = animalIdInput.value.trim();
  if(!id){ alert("Inserisci Animal ID"); return; }
  currentAnimalId = id;
  resetEvaluation();
  showEval();
};

prevBtn.onclick = () => {
  if(i>0){ i--; loadStep(); }
};

nextBtn.onclick = () => {
  if(i<7){ i++; loadStep(); return; }

  // calcolo media ponderata
  let num=0, den=0;
  for(let k=0;k<8;k++){ num += values[k]*weights[k]; den += weights[k]; }
  const avg = num/den;

  // salva taccuino
  addToLog(currentAnimalId, avg);

  // mostra risultato
  showResult(avg);
};

newAnimalBtn.onclick = () => showStart();

clearBtn.onclick = () => {
  if(confirm("Vuoi davvero svuotare la lista?")) clearLog();
};

copyBtn.onclick = async () => {
  await copyToClipboard(makeTextLog());
};

csvBtn.onclick = () => downloadCSV();

shareBtn.onclick = async () => {
  const text = makeTextLog();
  if(navigator.share){
    try{
      await navigator.share({ title:"BCS Log", text });
    }catch(e){
      // se l'utente annulla, non facciamo nulla
    }
  } else {
    await copyToClipboard(text);
  }
};

/* =======================
   Start
======================= */
buildWheel();
renderLog();
showStart();
</script>
</body>
</html>
